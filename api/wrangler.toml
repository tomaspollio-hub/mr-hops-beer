name = "mr-hops-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mr-hops-db"
database_id = "REEMPLAZAR_CON_TU_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "mr-hops-images"

[vars]
ENVIRONMENT = "production"
# Actualizar FRONTEND_URL con la URL de Cloudflare Pages una vez deployado
FRONTEND_URL = "https://mr-hops-beer.pages.dev"
# Actualizar R2_PUBLIC_URL con el dominio público del bucket R2
R2_PUBLIC_URL = "https://pub-REEMPLAZAR.r2.dev"

# ─── Desarrollo local ──────────────────────────────────────────────────────────
[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"
R2_PUBLIC_URL = "http://localhost:8787/images"
